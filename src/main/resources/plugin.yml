name: Minecraft_Plugin
version: '${version}'

main: me.pluginhirai.minecraft_Plugin.Minecraft_Plugin
api-version: '1.21'
load: POSTWORLD

commands:
  greet:
    description: Hirai Minecraft plugin.
  heal:
    description: Heals a player.
  damage:
    description: Damages a player.
  rtp:
    description: Teleport a player into random location.
permissions:
  minecraft_plugin.rtp:
    description: Allow use of /rtp
    default: true
  minecraft_plugin.rtp.bypass-cooldown:
    description: Bypass Rtp Cooldown
    default: false
